[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruian-history"
version = "0.1.0"
description = "Versioned (SCD2) history of RÚIAN building objects from monthly VFR snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "geopandas>=1.1",
    "shapely>=2.1",
    "pandas>=3.0",
    "lxml>=6.0",
    "pyogrio>=0.12",
    "requests>=2.32",
    "pyarrow>=21",
]

[project.optional-dependencies]
# plotting in the analysis notebooks (analysis/)
analysis = ["matplotlib>=3.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruian_history = ["cleaning/codelists/*.csv"]
